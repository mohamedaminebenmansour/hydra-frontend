<div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
  <h1>Hydra Cloud Test 🚀</h1>

  <div style="margin-bottom: 20px;">
    <input [(ngModel)]="newName" placeholder="Enter a name"
      style="padding: 10px; font-size: 16px; border: 1px solid #ccc;">
    <button (click)="save()"
      style="padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 16px;">
      Save to Cloud
    </button>
  </div>

  <h2>Saved in Supabase Database:</h2>
  <ul style="list-style: none; padding: 0; max-width: 500px; margin: 0 auto;">
    <li *ngFor="let n of names"
      style="padding: 10px; border: 1px solid #ccc; margin: 5px 0; border-radius: 5px; background: #f9f9f9;">
      {{ n.name }}
    </li>
  </ul>
</div>
